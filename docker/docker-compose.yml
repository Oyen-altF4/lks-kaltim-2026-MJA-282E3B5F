version: '3.9'

services:
  # ── Aplikasi API ─────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: api_app
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-api_db}
      DB_USER: ${DB_USER:-postgres}
      DB_PASS: ${DB_PASS:-rahasia}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - api_network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ── Database PostgreSQL ───────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: api_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-api_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASS:-rahasia}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - api_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-api_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── pgAdmin (GUI database — opsional, untuk development) ──────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: api_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@admin.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - api_network
    profiles:
      - dev  # hanya aktif saat: docker compose --profile dev up

volumes:
  postgres_data:
    driver: local

networks:
  api_network:
    driver: bridge
